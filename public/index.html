<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="header-left"><button class="menu-btn" onclick="toggleMenu()">☰</button></div>
    <div class="header-center"><h1>ATTENDANCE TRACKER</h1></div>
    <div class="header-right"><div id="liveClock" class="live-clock" style="cursor:pointer;" onclick="openModal('calendarMode')"></div></div>
  </header>

  <div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="theme-toggle-wrapper" onclick="toggleDarkMode()">
      <div class="neumorphic-toggle">
        <div class="toggle-thumb">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </div>
        <span class="toggle-text light-text">LIGHT MODE</span>
        <span class="toggle-text dark-text">DARK MODE</span>
      </div>
    </div>

    <ul>
      <li onclick="openModal('userManual')">How to Use the App</li>
      <li onclick="openModal('historyLog')">View History Log</li>
      <li onclick="openModal('setupCalendar')">Upload Academic Calendar</li>
      <li onclick="openModal('addTimetable')">Upload Timetable (OCR)</li>
      <li onclick="openModal('editAttendance')">Edit Attendance</li>
      <li onclick="openModal('addCourse')">Add Custom Course</li>
      <li onclick="openModal('removeCourse')">Remove Course</li>
    </ul>
  </nav>

  <div id="aiLoading" class="ocr-loading-overlay"><div class="spinner"></div><p>Gemini is reading the calendar...</p></div>
  <div id="ocrLoading" class="ocr-loading-overlay"><div class="spinner"></div><p>Scanning Timetable...</p></div>
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"><div class="modal-content" id="modalContent" onclick="event.stopPropagation()"></div></div>

  <main class="main-content">
    <div class="timetable-container">
      <div class="schedule-header">
        <h3>Weekly Schedule</h3>
        <button id="holidayBtn" class="holiday-btn" onclick="toggleHoliday()">Mark Today Holiday</button>
      </div>
      <div class="day-selector" id="daySelector">
        <button onclick="changeDay('Monday')">Mon</button>
        <button onclick="changeDay('Tuesday')">Tue</button>
        <button onclick="changeDay('Wednesday')">Wed</button>
        <button onclick="changeDay('Thursday')">Thu</button>
        <button onclick="changeDay('Friday')">Fri</button>
        <button onclick="changeDay('Saturday')">Sat</button>
      </div>
      <div id="timetableContainer" class="timetable-bar"></div>
    </div>
    <div id="courseList" class="course-list-container"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
