<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="styles.css?v=45">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
</head>
<body>

  <header class="header">
    <div class="header-left"><button class="menu-btn" onclick="toggleMenu()">☰</button></div>
    <div class="header-center"><h1>ATTENDANCE TRACKER</h1></div>
    <div class="header-right"><div id="liveClock" class="live-clock" style="cursor:pointer;" onclick="openModal('calendarMode')"></div></div>
  </header>

  <div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="theme-toggle-wrapper" onclick="toggleDarkMode()">
      <div class="neumorphic-toggle">
        <div class="toggle-thumb">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </div>
        <span class="toggle-text light-text">LIGHT MODE</span>
        <span class="toggle-text dark-text">DARK MODE</span>
      </div>
    </div>

    <ul>
      <li onclick="openModal('userManual')">How to Use the App</li>
      <!-- Removed Create Custom Timetable from here -->
      <li onclick="openModal('historyLog')">View History Log</li>
      <li onclick="openModal('setupCalendar')">Sync Academic Calendar</li>
      <li onclick="openModal('setTarget')">Set Target Attendance</li>
      <li onclick="openModal('editAttendance')">Edit Attendance</li>
      <li onclick="openModal('addCourse')">Add Custom Course</li>
      <li onclick="openModal('removeCourse')">Remove Course</li>
      <li onclick="resetToDefaultTimetable()" style="color:#e74c3c;">Reset Default Timetable</li>
    </ul>
  </nav>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"><div class="modal-content" id="modalContent" onclick="event.stopPropagation()"></div></div>

  <div class="split-screen-overlay" id="splitScreenOverlay">
    <div class="split-top" id="splitTopContainer">
      <button class="close-btn" style="z-index: 10; color: #fff; background: rgba(0,0,0,0.6); border-radius: 50%; width: 40px; height: 40px; top: 10px; right: 10px; position:absolute;" onclick="closeSplitScreen()">×</button>
      <div id="previewWrapper" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; overflow:hidden; position:relative;"></div>
    </div>
    <div class="split-bottom">
      <div class="setup-header">
        <h3 style="font-size: 0.85rem;">Paint: <span style="color:#9b2226">1x Red (Holiday)</span> | <span style="color:#005f73">2x Blue (Important)</span></h3>
        <button class="btn-present" style="padding: 8px 15px; font-size: 0.85rem;" onclick="saveSetupCalendar()">Save & Close</button>
      </div>
      <div id="setupCalendarContainer" class="setup-container"></div>
    </div>
  </div>

  <main class="main-content">
    <div class="timetable-container" id="timetableSection">
      <div class="schedule-header">
        <h3 id="timetableHeaderTitle">Daily Timetable</h3>
        <div style="display:flex; gap:15px; align-items:center;">
          <button id="editTimetableBtn" onclick="toggleTimetableEdit()" style="background:none; border:none; font-size:1.3rem; cursor:pointer;" title="Edit Timetable">✏️</button>
          <button id="holidayBtn" class="holiday-btn" onclick="toggleHoliday()">Mark Today Holiday</button>
        </div>
      </div>
      <div class="day-selector" id="daySelector">
        <button onclick="changeDay('Sunday')">Sun</button>
        <button onclick="changeDay('Monday')">Mon</button>
        <button onclick="changeDay('Tuesday')">Tue</button>
        <button onclick="changeDay('Wednesday')">Wed</button>
        <button onclick="changeDay('Thursday')">Thu</button>
        <button onclick="changeDay('Friday')">Fri</button>
        <button onclick="changeDay('Saturday')">Sat</button>
      </div>
      <div id="timetableContainer" class="timetable-bar"></div>
    </div>
    
    <div id="courseList" class="course-list-container" style="display:none;"></div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-timetable" onclick="switchTab('timetable')"><span style="font-size:1.5rem; margin-bottom:4px;">📅</span>Timetable</button>
    <button class="nav-btn" id="nav-courses" onclick="switchTab('courses')"><span style="font-size:1.5rem; margin-bottom:4px;">📚</span>Courses</button>
  </nav>

  <script src="script.js?v=45"></script>
</body>
</html>
